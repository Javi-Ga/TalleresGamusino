<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Inscripción - IES Gamusino</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-watermark-tiled">

  <!-- Header / Barra de Navegación -->
  <header class="main-header">
    <div class="header-container">
      <div class="logo">
        <i class="fa-solid fa-feather-pointed"></i>
      </div>
      <nav class="nav-links">
        <a href="index.html">Temáticas</a>
        <a href="informacion.html">Información</a>
        <a href="inscripcion.html" class="active">Inscripción</a>
        <a href="contacto.html">Contacto</a>
      </nav>
      <div class="header-tools">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search for...">
        </div>
        <button class="icon-btn" aria-label="Idioma"><i class="fa-solid fa-language"></i></button>
        <button class="icon-btn" aria-label="Perfil"><i class="fa-regular fa-user"></i></button>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="main-content success-main">
    <div class="container success-container">
      
      <h1 class="success-title">¡INSCRIPCIÓN REALIZADA CON ÉXITO!</h1>
      <p class="success-subtitle">Te has inscrito correctamente en el siguiente taller:</p>

      <!-- Tarjeta gris de datos -->
      <div class="success-card">
        <div class="success-card-item">
          <i class="fa-solid fa-building-columns"></i>
          <span>Taller</span>
        </div>
        <div class="success-card-item">
          <i class="fa-regular fa-clock"></i>
          <span>Fecha y hora</span>
        </div>
        <div class="success-card-item">
          <i class="fa-solid fa-location-dot"></i>
          <span>Aula</span>
        </div>
      </div>

      <p class="success-message">
        Se ha enviado un correo de confirmación<br>
        a tu correo electrónico
      </p>

      <a href="index.html" class="btn-green">Ver talleres</a>

    </div>
  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-container">
      <div class="footer-copy">
        IES GAMUSINO
      </div>
      <div class="footer-socials">
        <a href="#" aria-label="Youtube"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
      </div>
    </div>
  </footer>

</html>
